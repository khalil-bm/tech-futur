name: publish-daily

on:
  schedule:
    - cron: '0 6 * * *'     # 06:00 UTC ≈ 08:00 Paris, tous les jours
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  run-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip & install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run generator
        run: python generator.py

      - name: Create PR with changes
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: daily publish"
          title: "Daily post – $(date +'%Y-%m-%d')"
          body: "Article auto-généré du jour."
          branch: auto/daily-post
          base: main
          delete-branch: true
